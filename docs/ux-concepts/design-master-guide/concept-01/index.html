<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>UI 필드 가이드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700&family=Hahmlet:wght@500;600;700&display=swap">
<style>
/*
THESIS: a naturalist's field guide for UI. Each element is an entry with a live specimen, field marks (when / avoid) and a "lookalike" cross-reference. Refuses the card grid.
OWN-WORLD: cool grey-green paper, forest-green ink accent, rust only for "avoid". Hahmlet for entry names, Gothic A1 for reading. Hairline-separated entries, phone specimens in a thin bezel.
STORY: scan the index, use the identification key to pick the right element, read one entry, open its notes.
FIRST VIEWPORT: sticky index sidebar left; topic title, identification key and first entry right.
FORM: field guide with dichotomous key (concept 01 of 3).
*/
:root{
  --bg:#f1f4f1;--paper:#fbfcfa;--ink:#16201b;--ink-2:#34413a;--mut:#56645c;--line:#d3dbd5;--line-2:#e3e9e4;
  --acc:#1b6a4a;--acc-ink:#ffffff;--acc-soft:#dcebe2;--avoid:#a3402a;--bezel:#e2e8e3;--hatch:#dfe6e1;
  --focus:#1b6a4a;color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613;--paper:#171e1a;--ink:#e5ebe6;--ink-2:#c7d1ca;--mut:#9aa89f;--line:#2b3530;--line-2:#222b26;
  --acc:#72c79e;--acc-ink:#0d1a13;--acc-soft:#1d3529;--avoid:#ef9a82;--bezel:#24302a;--hatch:#1f2823;--focus:#72c79e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--paper:#171e1a;--ink:#e5ebe6;--ink-2:#c7d1ca;--mut:#9aa89f;--line:#2b3530;--line-2:#222b26;
  --acc:#72c79e;--acc-ink:#0d1a13;--acc-soft:#1d3529;--avoid:#ef9a82;--bezel:#24302a;--hatch:#1f2823;--focus:#72c79e;color-scheme:dark}
/* ===== demo kit (shared) ===== */
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}
.demo{position:relative;container-type:inline-size}
.demo .scr{--a-bg:#fbfbf9;--a-ink:#1d1e20;--a-mut:#686a6f;--a-line:#e6e5e1;--a-brand:#c24719;--a-err:#c22f29;--a-ok:#1d7a49;--a-dark:#232427;
  position:relative;aspect-ratio:3/4;overflow:hidden;font-size:6.25cqw;background:var(--a-bg);color:var(--a-ink);line-height:1.3;isolation:isolate;border-radius:.9em;letter-spacing:0;user-select:none;-webkit-user-select:none;font-weight:400;text-align:left}
.demo .scr *{box-sizing:border-box;animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
.demo:not(.run) *{animation-play-state:paused!important}
html.still .demo *,html.still .demo *::before,html.still .demo *::after{animation:none!important}
.demo:not(.run) *::before,.demo:not(.run) *::after{animation-play-state:paused!important}
.demo .scr .i{stroke-width:1.9}
.demo .sb{height:1.3em;padding:0 1em;display:flex;align-items:center;justify-content:space-between}
.demo .sb span:first-child{font-size:.55em;font-weight:700}
.demo .bat{width:1.1em;height:.5em;border:.07em solid currentColor;border-radius:.14em;position:relative;opacity:.8}
.demo .bat::after{content:"";position:absolute;inset:.08em .3em .08em .08em;background:currentColor;border-radius:.05em}
.demo .ab{position:relative;z-index:3;height:2.4em;display:flex;align-items:center;gap:0;padding:0 .6em 0 1em;background:var(--a-bg);border-bottom:1px solid var(--a-line)}
.demo .ab b{flex:1;font-size:.84em;font-weight:700}
.demo .ab .ib:first-child{margin-left:-.5em;margin-right:.1em}
.demo .ib{width:1.8em;height:1.8em;display:grid;place-items:center;position:relative;border-radius:50%}
.demo .ib .i{width:1.05em;height:1.05em;position:relative;z-index:1}
.demo .ls{position:relative}
.demo .r{position:relative;z-index:1;height:2.3em;display:flex;align-items:center;gap:.6em;padding:0 1em;border-bottom:1px solid var(--a-line);background:var(--a-bg)}
.demo .cb{position:relative;width:1em;height:1em;border-radius:50%;border:.09em solid #b5b6b1;flex:none}
.demo .ck{position:absolute;inset:-.09em;border-radius:50%;background:var(--a-brand);color:#fff;display:grid;place-items:center;opacity:0}
.demo .ck .i{width:.7em;height:.7em;stroke-width:3}
.demo .r .n{flex:0 1 auto;margin-right:auto;font-size:.74em;position:relative}
.demo .r .q{font-size:.66em;color:var(--a-mut)}
.demo .tap{position:absolute;z-index:30;width:1.7em;height:1.7em;margin:-.85em 0 0 -.85em;border-radius:50%;background:rgba(29,30,32,.2);border:.1em solid rgba(29,30,32,.42);opacity:0;pointer-events:none}
.demo .scrim{position:absolute;inset:0;z-index:10;background:rgba(18,18,20,.5);opacity:0}
/* toast */
.d-toast .r2 .ck{animation-name:toastCk}
.d-toast .r2 .n::after{content:"";position:absolute;left:0;right:0;top:55%;height:.08em;background:currentColor;transform-origin:left;transform:scaleX(0);animation:inherit;animation-name:toastStrike;animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both}
.d-toast .toast{position:absolute;z-index:12;left:50%;bottom:1.5em;display:flex;align-items:center;gap:.45em;padding:.6em 1em;border-radius:2em;background:var(--a-dark);color:#f4f4f2;white-space:nowrap;transform:translate(-50%,.8em);opacity:0;animation-name:toastIn;box-shadow:0 .4em 1em rgba(20,20,22,.18)}
.d-toast .toast span{font-size:.7em}
.d-toast .toast .i{color:#7fd6a3;width:.95em;height:.95em}
.d-toast .t1{animation-name:tapT1}
@keyframes toastCk{0%,11%{opacity:0;transform:scale(.4)}15%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0;transform:scale(1)}}
@keyframes toastStrike{0%,12%{transform:scaleX(0)}19%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes toastIn{0%,18%{opacity:0;transform:translate(-50%,.8em)}24%,70%{opacity:1;transform:translate(-50%,0)}78%,100%{opacity:0;transform:translate(-50%,.4em)}}
html.still .d-toast .r2 .ck{opacity:1;transform:none}
html.still .d-toast .r2 .n::after{transform:scaleX(1)}
html.still .d-toast .toast{opacity:1;transform:translate(-50%,0)}
/* snackbar */
.d-snackbar .del{position:absolute;z-index:0;left:0;right:0;top:4.6em;height:2.3em;background:var(--a-err);color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:1.1em;opacity:0;animation-name:snkDel}
.d-snackbar .r3{animation-name:snkRow}
.d-snackbar .lsb{position:relative;z-index:2;animation-name:snkUp}
.d-snackbar .snk{position:absolute;z-index:12;left:.7em;right:.7em;bottom:.8em;height:2.6em;display:flex;align-items:center;justify-content:space-between;padding:0 .9em;border-radius:.45em;background:var(--a-dark);color:#f3f3f1;transform:translateY(3.6em);animation-name:snkIn;box-shadow:0 .4em 1em rgba(20,20,22,.2)}
.d-snackbar .st{font-size:.68em}
.d-snackbar .sa{font-size:.68em;font-weight:700;color:#ffb48f}
.d-snackbar .sd{animation-name:tapSnkD}
.d-snackbar .su{animation-name:tapSU}
@keyframes snkDel{0%,7%{opacity:0}9%,17%{opacity:1}22%,100%{opacity:0}}
@keyframes snkRow{0%,8%{transform:translateX(0);opacity:1}17%,64%{transform:translateX(-105%);opacity:0}72%,100%{transform:translateX(0);opacity:1}}
@keyframes snkUp{0%,16%{transform:translateY(0)}24%,62%{transform:translateY(-2.3em)}70%,100%{transform:translateY(0)}}
@keyframes snkIn{0%,20%{transform:translateY(3.6em)}26%,60%{transform:translateY(0)}66%,100%{transform:translateY(3.6em)}}
@keyframes tapSnkD{0%,4%{opacity:0;transform:translateX(0) scale(1.4)}7%{opacity:1;transform:translateX(0) scale(.85)}15%{opacity:1;transform:translateX(-7em) scale(.85)}18%,100%{opacity:0;transform:translateX(-7em) scale(.85)}}
html.still .d-snackbar .r3{opacity:0}
html.still .d-snackbar .lsb{transform:translateY(-2.3em)}
html.still .d-snackbar .snk{transform:none}
/* banner */
.d-banner .bn{position:absolute;z-index:2;left:0;right:0;top:3.7em;height:2.7em;transform:translateY(-100%);animation-name:bnIn}
.d-banner .bn>div{position:absolute;inset:0;display:flex;align-items:center;gap:.55em;padding:0 1em}
.d-banner .bn span{font-size:.62em;line-height:1.35}
.d-banner .bn .i{width:1.05em;height:1.05em}
.d-banner .bn-off{background:#fbe9c2;color:#4d3606;animation-name:bnOff}
.d-banner .bn-on{background:#dcf1e3;color:#124a2c;opacity:0;animation-name:bnOn}
.d-banner .ls{animation-name:lsPush}
@keyframes bnIn{0%,10%{transform:translateY(-100%)}18%,80%{transform:translateY(0)}88%,100%{transform:translateY(-100%)}}
@keyframes lsPush{0%,10%{transform:translateY(0)}18%,80%{transform:translateY(2.7em)}88%,100%{transform:translateY(0)}}
@keyframes bnOff{0%,62%{opacity:1}66%,100%{opacity:0}}
@keyframes bnOn{0%,62%{opacity:0}66%,100%{opacity:1}}
html.still .d-banner .bn{transform:none}
html.still .d-banner .ls{transform:translateY(2.7em)}
html.still .d-banner .bn-on{opacity:0}
/* modal */
.d-modal .scrim{animation-name:mdScrim}
.d-modal .dlg{position:absolute;z-index:11;left:1.6em;right:1.6em;top:6.2em;height:8em;padding:1.1em;border-radius:.8em;background:#fff;opacity:0;transform:scale(.94);animation-name:mdDlg;box-shadow:0 .8em 2em rgba(10,10,12,.28)}
.d-modal .dlg b{display:block;font-size:.82em}
.d-modal .dlg p{margin:.6em 0 0;font-size:.64em;color:var(--a-mut);line-height:1.45}
.d-modal .dbtn{position:absolute;right:1.1em;bottom:1.1em;display:flex;gap:.4em}
.d-modal .dbtn span{display:grid;place-items:center;border-radius:.76em;font-size:.66em;width:5.45em;height:2.88em}
.d-modal .b0{background:#efefec;color:var(--a-ink)}
.d-modal .b1{background:var(--a-err);color:#fff;font-weight:700}
.d-modal .m1{animation-name:tapM1}
.d-modal .m2{animation-name:tapM2}
@keyframes mdScrim{0%,13%{opacity:0}19%,66%{opacity:1}74%,100%{opacity:0}}
@keyframes mdDlg{0%,14%{opacity:0;transform:scale(.94)}21%,64%{opacity:1;transform:scale(1)}70%,100%{opacity:0;transform:scale(.97)}}
html.still .d-modal .scrim{opacity:1}
html.still .d-modal .dlg{opacity:1;transform:none}
/* bottom sheet */
.d-sheet .scrim{animation-name:shScrim}
.d-sheet .sh{position:absolute;z-index:11;left:0;right:0;bottom:0;height:10.4em;background:#fff;border-radius:1em 1em 0 0;transform:translateY(100%);animation-name:shUp;box-shadow:0 -.4em 1.4em rgba(10,10,12,.16)}
.d-sheet .hd{position:absolute;left:50%;top:.6em;width:2.2em;height:.25em;margin-left:-1.1em;border-radius:1em;background:#cfcfcb}
.d-sheet .sh b{position:absolute;left:1.35em;top:1.55em;font-size:.76em}
.d-sheet .op{position:absolute;left:1em;right:1em;height:2.1em;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--a-line)}
.d-sheet .o1{top:3.1em}.d-sheet .o2{top:5.2em}.d-sheet .o3{top:7.3em}
.d-sheet .op span:first-child{font-size:.7em}
.d-sheet .rd{width:1em;height:1em;border-radius:50%;border:.09em solid #b5b6b1;display:grid;place-items:center}
.d-sheet .rd i{width:.5em;height:.5em;border-radius:50%;background:var(--a-brand);opacity:0}
.d-sheet .o1 .rd i{animation-name:shR1}
.d-sheet .o2 .rd i{animation-name:shR2}
.d-sheet .s1{animation-name:tapS1}
.d-sheet .s2{animation-name:tapS2}
@keyframes shScrim{0%,13%{opacity:0}20%,66%{opacity:1}76%,100%{opacity:0}}
@keyframes shUp{0%,13%{transform:translateY(100%)}24%,64%{transform:translateY(0)}76%,100%{transform:translateY(100%)}}
@keyframes shR1{0%,52%{opacity:1}55%,100%{opacity:0}}
@keyframes shR2{0%,52%{opacity:0}55%,100%{opacity:1}}
html.still .d-sheet .scrim{opacity:1}
html.still .d-sheet .sh{transform:none}
html.still .d-sheet .o1 .rd i{opacity:1}
/* inline error */
.d-inline .fm{position:absolute;left:0;right:0;top:3.7em;bottom:0}
.d-inline .lb{position:absolute;left:1em;font-size:.6em;font-weight:700;color:var(--a-mut)}
.d-inline .l1{top:1.1em}.d-inline .l2{top:7.6em}
.d-inline .fd{position:absolute;left:1em;right:1em;height:2.3em;border:.07em solid #cfcfca;border-radius:.5em;display:flex;align-items:center;padding:0 .8em;background:#fff}
.d-inline .f1{top:1.5em}.d-inline .f2{top:5.4em}
.d-inline .fd>span:first-child{font-size:.74em}
.d-inline .slot{position:relative;display:inline-block;width:.62em;height:1.3em}
.d-inline .slot span{position:absolute;left:0;top:0;opacity:0}
.d-inline .c0{animation-name:inZero}
.d-inline .c2{animation-name:inTwo}
.d-inline .scr .caret{display:inline-block;vertical-align:middle;width:.07em;height:1.05em;margin-left:.08em;background:var(--a-brand);animation-name:inCaret,blink;animation-duration:var(--cyc),1s;animation-timing-function:linear,steps(1)}
.d-inline .bF,.d-inline .bE{position:absolute;inset:-.07em;border-radius:.5em;border:.12em solid var(--a-brand);opacity:0;pointer-events:none}
.d-inline .bF{animation-name:inF}
.d-inline .bE{border-color:var(--a-err);animation-name:inE}
.d-inline .ok{position:absolute;right:.7em;top:50%;margin-top:-.5em;width:1em;height:1em;color:var(--a-ok);opacity:0;animation-name:inOk}
.d-inline .ok .i{width:1em;height:1em;display:block}
.d-inline .msg{position:absolute;left:1em;top:8em;display:flex;align-items:center;gap:.35em;color:var(--a-err);opacity:0;animation-name:inMsg}
.d-inline .msg span{font-size:.62em;font-weight:700}
.d-inline .msg .i{width:.85em;height:.85em}
.d-inline .go{position:absolute;left:1em;right:1em;bottom:1em;height:2.4em;border-radius:.6em;background:var(--a-brand);color:#fff;display:grid;place-items:center;font-weight:700}
.d-inline .go{font-size:.72em;left:1.39em;right:1.39em;bottom:1.39em;height:3.33em}
.d-inline .i1{animation-name:tapI1}
.d-inline .i2{animation-name:tapI2}
@keyframes inZero{0%,13%{opacity:0}14%,62%{opacity:1}63%,100%{opacity:0}}
@keyframes inTwo{0%,63%{opacity:0}65%,96%{opacity:1}100%{opacity:0}}
@keyframes inCaret{0%,26%{opacity:1}27%,57%{opacity:0}58%,80%{opacity:1}81%,100%{opacity:0}}
@keyframes blink{0%{visibility:visible}50%{visibility:hidden}}
@keyframes inF{0%,26%{opacity:1}28%,57%{opacity:0}59%,80%{opacity:1}84%,100%{opacity:0}}
@keyframes inE{0%,27%{opacity:0}30%,63%{opacity:1}66%,100%{opacity:0}}
@keyframes inMsg{0%,28%{opacity:0;transform:translateY(-.3em)}33%,63%{opacity:1;transform:none}68%,100%{opacity:0;transform:translateY(-.3em)}}
@keyframes inOk{0%,84%{opacity:0}88%,96%{opacity:1}100%{opacity:0}}
html.still .d-inline .c0{opacity:1}
html.still .d-inline .bE{opacity:1}
html.still .d-inline .msg{opacity:1;transform:none}
html.still .d-inline .caret{opacity:0}
/* tooltip */
.d-tooltip .ib-share::before{content:"";position:absolute;inset:0;border-radius:50%;background:#e9e8e4;opacity:0;animation:inherit;animation-name:ttHov;animation-duration:var(--cyc);animation-iteration-count:infinite;animation-fill-mode:both}
.d-tooltip .tt{position:absolute;z-index:12;top:3.75em;right:.4em;padding:.5em .75em;border-radius:.45em;background:var(--a-dark);color:#f4f4f2;white-space:nowrap;opacity:0;animation-name:ttIn}
.d-tooltip .tt::before{content:"";position:absolute;top:-.3em;right:2.5em;width:.6em;height:.6em;background:inherit;transform:rotate(45deg);border-radius:.08em}
.d-tooltip .tt span{font-size:.62em;position:relative}
.d-tooltip .cur{position:absolute;z-index:20;left:0;top:0;width:1.3em;height:1.3em;opacity:0;transform:translate(6em,12em);animation-name:ttCur}
.d-tooltip .cur .i{width:1.3em;height:1.3em;display:block;stroke-width:1.6}
@keyframes ttHov{0%,24%{opacity:0}27%,70%{opacity:1}73%,100%{opacity:0}}
@keyframes ttIn{0%,32%{opacity:0;transform:translateY(-.25em)}40%,70%{opacity:1;transform:none}78%,100%{opacity:0;transform:none}}
@keyframes ttCur{0%{opacity:0;transform:translate(6em,12em)}6%{opacity:1;transform:translate(6em,12em)}25%,70%{opacity:1;transform:translate(12.55em,2.45em)}88%{opacity:1;transform:translate(9em,8em)}96%,100%{opacity:0;transform:translate(9em,8em)}}
html.still .d-tooltip .ib-share::before{opacity:1}
html.still .d-tooltip .tt{opacity:1;transform:none}
html.still .d-tooltip .cur{opacity:1;transform:translate(12.55em,2.45em)}
/* coach mark */
.d-coach .fab{position:absolute;z-index:5;right:1.1em;bottom:1.1em;width:2.6em;height:2.6em;border-radius:50%;background:var(--a-brand);color:#fff;display:grid;place-items:center;box-shadow:0 .3em .8em rgba(194,71,25,.3)}
.d-coach .fab .i{width:1.2em;height:1.2em;stroke-width:2.4}
.d-coach .spot{position:absolute;z-index:10;right:.7em;bottom:.7em;width:3.4em;height:3.4em;border-radius:50%;box-shadow:0 0 0 40em rgba(14,14,16,.64);opacity:0;animation-name:cmSpot}
.d-coach .cm{position:absolute;z-index:12;right:1em;bottom:4.6em;width:10.6em;padding:.8em .85em;border-radius:.7em;background:#fff;opacity:0;transform:translateY(.4em);animation-name:cmIn}
.d-coach .cm::after{content:"";position:absolute;right:1.05em;bottom:-.3em;width:.6em;height:.6em;background:#fff;transform:rotate(45deg)}
.d-coach .cm b{display:block;font-size:.7em}
.d-coach .cm p{margin:.4em 0 .7em;font-size:.58em;color:var(--a-mut);line-height:1.45}
.d-coach .cmb{display:flex;justify-content:space-between;align-items:center}
.d-coach .cmb span{font-size:.62em;color:var(--a-mut)}
.d-coach .cmb .go2{color:var(--a-brand);font-weight:700}
.d-coach .c1{animation-name:tapC1}
@keyframes cmSpot{0%,8%{opacity:0}16%,64%{opacity:1}72%,100%{opacity:0}}
@keyframes cmIn{0%,14%{opacity:0;transform:translateY(.4em)}22%,64%{opacity:1;transform:none}70%,100%{opacity:0;transform:none}}
html.still .d-coach .spot{opacity:1}
html.still .d-coach .cm{opacity:1;transform:none}
/* badge */
.d-badge .tb{position:absolute;z-index:4;left:0;right:0;bottom:0;height:2.9em;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--a-line);background:var(--a-bg)}
.d-badge .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;color:var(--a-mut)}
.d-badge .tab .i{width:1.1em;height:1.1em}
.d-badge .tab em{font-style:normal;font-size:.5em;font-weight:700}
.d-badge .tab.on{color:var(--a-ink)}
.d-badge .ti{position:relative;display:block;width:1.1em;height:1.1em}
.d-badge .ti .i{display:block}
.d-badge .bdg{position:absolute;top:-.4em;right:-.65em;min-width:1em;height:1em;border-radius:.5em;background:#d42f1d;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 .12em var(--a-bg);transform:scale(0);animation-name:bdPop}
.d-badge .bw{position:relative;width:1em;height:1em;animation-name:bdBump}
.d-badge .bw b{position:absolute;inset:0;display:grid;place-items:center;font-size:.58em;line-height:1;opacity:0}
.d-badge .n1{animation-name:bdN1}.d-badge .n2{animation-name:bdN2}.d-badge .n3{animation-name:bdN3}
.d-badge .fam em{animation-name:bdAct}
.d-badge .b1{animation-name:tapB1}
@keyframes bdPop{0%,14%{transform:scale(0)}18%{transform:scale(1.25)}22%,68%{transform:scale(1)}74%,100%{transform:scale(0)}}
@keyframes bdBump{0%,35%{transform:scale(1)}38%{transform:scale(1.25)}41%,49%{transform:scale(1)}52%{transform:scale(1.25)}55%,100%{transform:scale(1)}}
@keyframes bdN1{0%,36%{opacity:1}37%,100%{opacity:0}}
@keyframes bdN2{0%,36%{opacity:0}37%,50%{opacity:1}51%,100%{opacity:0}}
@keyframes bdN3{0%,50%{opacity:0}51%,100%{opacity:1}}
@keyframes bdAct{0%,69%{color:var(--a-mut)}72%,95%{color:var(--a-ink)}100%{color:var(--a-mut)}}
html.still .d-badge .bdg{transform:none}
html.still .d-badge .n3{opacity:1}

.tl{margin-top:10px;font-size:11px;line-height:1}

      `<span class="lb l2">수량</span><div class="fd f2"><span class="slot"><span class="c0">0</span><span class="c2">2</span></span><i class="caret"></i><span class="bF"></span><span class="bE"></span><span class="ok">${icon('checkCircle')}</span></div>` +
      `<div class="msg">${icon('alert')}<span>1개 이상 입력해 주세요</span></div><div class="go">목록에 담기</div></div>` +
      tap('i1', 8, 16) + tap('i2', 8, 10.25),
    tooltip: () => head() + `<div class="ls">${rows()}</div>` +
      '<div class="tt"><span>가족과 목록 공유</span></div>' + `<span class="cur">${icon('cursor')}</span>`,
    coach: () => head() + `<div class="ls">${rows()}</div>` + `<div class="fab">${icon('plus')}</div>` +
      '<div class="spot"></div><div class="cm"><b>새 항목은 여기서 추가해요</b><p>가족이 담은 항목도 같은 목록에 모여요.</p><div class="cmb"><span>건너뛰기</span><span class="go2">알겠어요</span></div></div>' +
      tap('c1', 12.95, 15.3),
    badge: () => head() + `<div class="ls">${rows()}</div>` +
      `<div class="tb"><span class="tab on">${icon('list')}<em>목록</em></span><span class="tab fam"><span class="ti">${icon('users')}<span class="bdg"><span class="bw"><b class="n1">1</b><b class="n2">2</b><b class="n3">3</b></span></span></span><em>가족</em></span><span class="tab">${icon('sliders')}<em>설정</em></span></div>` +
      tap('b1', 8, 19.9)
  };

  const fmt = ms => (ms / 1000).toFixed(ms % 1000 ? 1 : 1) + 's';
  function timeline(e) {
    const segs = e.phases.map(([t, a, b]) => {
      const l = (a / e.cyc) * 100, w = ((b - a) / e.cyc) * 100;
      return `<span class="tl-seg tl-${t === '유지' || t === '갱신' ? 'hold' : t === '지연' ? 'wait' : 'move'}" style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%" title="${t} ${a}~${b}ms"><em>${t}</em></span>`;
    }).join('');
    return `<div class="tl" aria-hidden="true"><div class="tl-track">${segs}<i class="tl-run"></i></div><div class="tl-scale"><span>0</span><span>${fmt(e.cyc)}</span></div></div>`;
  }
  function demo(id, opt = {}) {
    const e = byId[id];
    return `<div class="demo d-${id}" style="--cyc:${e.cyc}ms" role="img" aria-label="${e.alt}"><div class="scr">${scenes[id]()}</div>${opt.timeline ? timeline(e) : ''}</div>`;
  }

  /* ---------- helpers ---------- */
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { if (v == null) window.localStorage.removeItem(k); else window.localStorage.setItem(k, v); } catch (_) { /* storage blocked */ } }
  };
  let io = null;
  function observe(root) {
    const list = (root || document).querySelectorAll('.demo');
    if (!('IntersectionObserver' in window)) { list.forEach(d => d.classList.add('run')); return; }
    if (!io) io = new IntersectionObserver(ents => ents.forEach(en => en.target.classList.toggle('run', en.isIntersecting)), { threshold: 0.12 });
    list.forEach(d => io.observe(d));
  }
  const mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const motion = {
    isStill() { const p = store.get('dm-motion'); return p ? p === 'still' : !!mq.matches; },
    apply() { document.documentElement.classList.toggle('still', motion.isStill()); motion.onchange && motion.onchange(motion.isStill()); },
    toggle() { store.set('dm-motion', motion.isStill() ? 'play' : 'still'); motion.apply(); },
    onchange: null
  };
  if (mq.addEventListener) mq.addEventListener('change', () => motion.apply());
  const theme = {
    order: [null, 'light', 'dark'],
    label: { null: '시스템', light: '밝게', dark: '어둡게' },
    get() { const v = store.get('dm-theme'); return v === 'light' || v === 'dark' ? v : null; },
    apply() { const v = theme.get(); if (v) document.documentElement.setAttribute('data-theme', v); else document.documentElement.removeAttribute('data-theme'); theme.onchange && theme.onchange(v); },
    cycle() { const i = theme.order.indexOf(theme.get()); store.set('dm-theme', theme.order[(i + 1) % 3]); theme.apply(); },
    onchange: null
  };
  const norm = s => String(s).toLowerCase().replace(/\s+/g, '');
  const match = (e, q) => { const n = norm(q); if (!n) return true; return [e.ko, e.en, ...e.aka].some(s => norm(s).includes(n)); };
  function parseHash() {
    const h = decodeURIComponent((location.hash || '').slice(1));
    for (const t of topics) {
      if (h === t.id) return { topic: t, el: null };
      if (h.startsWith(t.id + '-')) { const rest = h.slice(t.id.length + 1); if (t.ready && byId[rest]) return { topic: t, el: rest }; }
    }
    return { topic: topics.find(t => t.id === 'feedback'), el: null };
  }
  return { icon, topics, groups, els, byId, demo, timeline, observe, motion, theme, match, parseHash, store, fmt };
})();

(() => {
  const { icon, topics, groups, els, byId, demo, observe, motion, theme, match, parseHash } = KIT;
  const $ = s => document.querySelector(s);
  document.querySelectorAll('[data-i]').forEach(n => { n.outerHTML = icon(n.dataset.i); });
  const main = $('#main'), nav = $('#nav'), q = $('#q'), qnote = $('#qnote'), where = $('#where');
  const side = $('#side'), scrimx = $('#scrimx'), openNav = $('#openNav');
  let cur = null, spy = null;

  const KEY = [
    ['꼭 결정을 받아야 해요', 'modal'], ['방금 한 일을 되돌릴 수 있어야 해요', 'snackbar'],
    ['폰에서 이 화면에 딸린 선택지를 내밀어요', 'sheet'], ['끝났다는 사실만 알리면 돼요', 'toast'],
    ['상태가 한동안 이어져요', 'banner'], ['특정 입력값이 틀렸어요', 'inline'],
    ['가리킨 아이콘의 이름이 필요해요', 'tooltip'], ['새 기능을 처음 한 번 알려요', 'coach'],
    ['확인하지 않은 새 소식이 있어요', 'badge']
  ];

  nav.innerHTML = groups.map(g => `<section><h2>${g.name}</h2><ul>${g.topics.map(t =>
    `<li><a href="#${t.id}" data-t="${t.id}">${t.ko}${t.ready ? `<span class="c">${t.items.length}</span>` : `<span class="soon">준비 중</span>`}</a></li>`).join('')}</ul></section>`).join('');

  function entry(t, e) {
    const other = e.vs.with ? byId[e.vs.with] : null;
    return `<article class="ent" id="${t.id}-${e.id}" data-id="${e.id}" aria-labelledby="h-${e.id}">
      <figure class="spec">${demo(e.id)}<figcaption>${(e.cyc / 1000).toFixed(0)}초마다 반복</figcaption></figure>
      <div class="body">
        <h2 id="h-${e.id}"><span class="ko">${e.ko}</span><span class="enn">${e.en}</span></h2>
        <dl class="marks">
          <div><dt>${icon('checkCircle')}언제</dt><dd>${e.when}</dd></div>
          <div class="no"><dt>${icon('xCircle')}피할 때</dt><dd>${e.avoid}</dd></div>
        </dl>
        <p class="kin">닮은 요소 ${other ? `<a href="#${t.id}-${other.id}">${other.ko}</a>` : `<b>${e.vs.withName}</b> (다른 주제)`}</p>
        <button class="more" type="button" aria-expanded="false" aria-controls="d-${e.id}">구현 메모와 차이 ${icon('chevD')}</button>
        <div class="detail" id="d-${e.id}" hidden>
          <h3>구현할 때</h3><ul>${e.impl.map(x => `<li>${x.replace(/(aria-[a-z]+(="[a-z]+")?)/g, '<code>$1</code>')}</li>`).join('')}</ul>
          <h3>${other ? other.ko : e.vs.withName}와 다른 점</h3><p>${e.vs.text}</p>
        </div>
      </div>
    </article>`;
  }

  function renderTopic(t) {
    cur = t;
    if (spy) { spy.disconnect(); spy = null; }
    nav.querySelectorAll('a').forEach(a => { if (a.dataset.t === t.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    q.value = ''; qnote.textContent = '';
    const crumb = `<p class="crumb"><a href="#feedback">가이드</a> / ${t.groupName}</p>`;
    if (t.ready) {
      main.innerHTML = `<header>${crumb}<h1>${t.ko}</h1><p class="en">${t.en}</p>
        <p class="lede">앱이 사용자에게 말을 거는 아홉 가지 방법이에요. 얼마나 급한지, 사용자가 무엇을 해야 하는지에 따라 고릅니다.</p></header>
        <details class="key" id="key"${window.innerWidth > 860 ? ' open' : ''}><summary><h2>어떤 걸 쓸까</h2><span>상황으로 요소 고르기</span>${icon('chevD')}</summary><p>지금 상황에 맞는 줄을 찾아 오른쪽 요소로 가세요.</p>
        <ol>${KEY.map(([s, id]) => `<li><span>${s}</span><a href="#${t.id}-${id}" data-k="${id}">${byId[id].ko}</a></li>`).join('')}</ol></details>
        <div class="entries" id="entries">${els.map(e => entry(t, e)).join('')}</div>
        <div class="noresult" id="noresult" hidden><b>찾는 요소가 이 주제에 없어요</b><p>이름을 한글이나 영어로 다시 입력해 보세요. 예: 토스트, snackbar</p><button class="tbtn" type="button" id="clearQ">검색 지우기</button></div>`;
      observe(main);
      setupSpy();
      $('#clearQ').addEventListener('click', () => { q.value = ''; filter(); q.focus(); });
    } else {
      main.innerHTML = `<header>${crumb}<h1>${t.ko}</h1><p class="en">${t.en}</p>
        <p class="lede">이 주제는 아직 채우는 중이에요. 들어갈 요소 ${t.items.length}개의 이름을 먼저 적어 두었어요. 시연이 생기면 이 자리에 하나씩 채워집니다.</p></header>
        <div class="blank-grid">${t.items.map(n => `<figure class="blank"><div class="slot" aria-hidden="true"></div><figcaption>${n}<span>시연 준비 중</span></figcaption></figure>`).join('')}</div>
        <a class="backlink" href="#feedback">완성된 주제 보기: 알림·피드백 ${icon('arrowR')}</a>`;
      where.innerHTML = `<b>${t.ko}</b> 준비 중`;
    }
    if (t.ready) where.innerHTML = `<b>${t.ko}</b>`;
  }

  function setupSpy() {
    if (!('IntersectionObserver' in window)) return;
    spy = new IntersectionObserver(ents => {
      ents.forEach(en => {
        if (!en.isIntersecting) return;
        const id = en.target.dataset.id, i = els.findIndex(e => e.id === id);
        where.innerHTML = `<b>${cur.ko}</b> ${i + 1} / ${els.length} ${byId[id].ko}`;
        main.querySelectorAll('.key a').forEach(a => a.classList.toggle('here', a.dataset.k === id));
      });
    }, { rootMargin: '-35% 0px -55% 0px' });
    main.querySelectorAll('.ent').forEach(a => spy.observe(a));
  }

  function filter() {
    const v = q.value.trim();
    if (!cur.ready) { qnote.textContent = v ? '이 주제에는 아직 찾을 요소가 없어요.' : ''; return; }
    let n = 0;
    main.querySelectorAll('.ent').forEach(a => { const ok = match(byId[a.dataset.id], v); a.hidden = !ok; if (ok) n++; });
    $('#noresult').hidden = n > 0;
    qnote.textContent = v ? `${els.length}개 중 ${n}개` : '';
  }
  q.addEventListener('input', filter);

  main.addEventListener('click', ev => {
    const b = ev.target.closest('.more'); if (!b) return;
    const d = document.getElementById(b.getAttribute('aria-controls'));
    const open = b.getAttribute('aria-expanded') !== 'true';
    b.setAttribute('aria-expanded', String(open)); d.hidden = !open;
  });

  function route() {
    const { topic, el } = parseHash();
    if (topic !== cur) renderTopic(topic);
    if (el) {
      const a = document.getElementById(`${topic.id}-${el}`);
      if (a) { if (a.hidden) { q.value = ''; filter(); } a.scrollIntoView({ block: 'start', behavior: motion.isStill() ? 'auto' : 'smooth' }); }
    } else window.scrollTo(0, 0);
    closeNav();
  }
  window.addEventListener('hashchange', route);

  function closeNav() { side.classList.remove('open'); scrimx.classList.remove('open'); openNav.setAttribute('aria-expanded', 'false'); }
  openNav.addEventListener('click', () => { side.classList.add('open'); scrimx.classList.add('open'); openNav.setAttribute('aria-expanded', 'true'); const a = nav.querySelector('[aria-current]'); (a || q).focus(); });
  scrimx.addEventListener('click', () => { closeNav(); openNav.focus(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && side.classList.contains('open')) { closeNav(); openNav.focus(); } });

  const mb = $('#motionBtn'), tb = $('#themeBtn');
  motion.onchange = still => { mb.innerHTML = `${icon(still ? 'play' : 'pause')}${still ? '시연 재생' : '시연 멈춤'}`; mb.setAttribute('aria-pressed', String(still)); };
  theme.onchange = v => { tb.innerHTML = `${icon('contrast')}화면 ${theme.label[v]}`; };
  mb.addEventListener('click', motion.toggle); tb.addEventListener('click', theme.cycle);
  motion.apply(); theme.apply();
  route();
})();
</script>
