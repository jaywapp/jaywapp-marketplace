<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>UI 요소 가이드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="kit.css">
<link rel="stylesheet" href="guide.css">
</head>
<body>
<a class="skip" href="#stage">본문으로 건너뛰기</a>
<div class="wrap">
  <header class="top" id="top">
    <a class="brand" href="#feedback">UI 요소 가이드</a>
    <div class="topic">
      <button class="ic" id="tPrev" type="button" aria-label="이전 주제"><span data-i="chevL"></span></button>
      <button class="tname" id="tOpen" type="button" aria-haspopup="dialog"><b id="tName">알림·피드백</b><small id="tCount"></small><span data-i="chevD"></span></button>
      <button class="ic" id="tNext" type="button" aria-label="다음 주제"><span data-i="chevR"></span></button>
    </div>
    <div class="tools">
      <div class="sbox">
        <label class="sfield"><span class="vh">모든 주제에서 요소 찾기</span><span data-i="search"></span>
          <input id="q" type="search" placeholder="요소 이름 찾기" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list"></label>
        <ul class="results" id="results" role="listbox" aria-label="검색 결과" hidden></ul>
      </div>
      <button class="ic qbtn" id="qBtn" type="button" aria-label="검색 열기" aria-expanded="false"><span data-i="search"></span></button>
      <button class="ic" id="motionBtn" type="button" aria-label="시연 멈춤"></button>
    </div>
  </header>
  <main class="stage" id="stage" tabindex="-1"></main>
  <nav class="rail" id="rail" aria-label="출연 순서"></nav>
</div>
<dialog class="program" id="program" aria-labelledby="pTitle">
  <div class="ph"><h2 id="pTitle">주제 23개</h2><button class="ic" type="button" data-close aria-label="닫기"><span data-i="x"></span></button></div>
  <ul class="plist" id="plist"></ul>
</dialog>
<dialog class="msheet" id="msheet" aria-labelledby="mTitle">
  <i class="grab" aria-hidden="true"></i>
  <button class="ic x" type="button" data-close aria-label="닫기"><span data-i="x"></span></button>
  <div id="mBody"></div>
</dialog>
<noscript><p style="padding:16px">이 가이드는 자바스크립트가 켜져 있어야 시연을 보여 줄 수 있어요.</p></noscript>
<script src="kit.js"></script>
<script src="topics/_manifest.js"></script>
<script src="guide.js"></script>
</body>
</html>
